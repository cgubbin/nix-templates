[project]
name = "my-project"
version = "0.1.0"
description = "A Python application template using uv and Nix"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
my-project = "my_project.cli:main"

[dependency-groups]
dev = [
  "ipykernel>=6.29.0",
  "jupyterlab>=4.4.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
