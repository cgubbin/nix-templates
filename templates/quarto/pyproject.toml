[project]
name = "quarto-python"
version = "0.1.0"
description = "Quarto-first Python analysis/reporting environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ipykernel>=6.29.0",
  "jupyterlab>=4.4.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "plotly>=6.0.0",
  "scipy>=1.15.0",
  "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
